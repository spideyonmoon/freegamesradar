name: GamerPower Bot

on:
  schedule:
    # Hourly, off the top of the hour (GitHub delays or drops :00 jobs under load)
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: gamerpower-bot
  cancel-in-progress: false

jobs:
  check-games:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Needed to push changes to sent_games.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_IDS: ${{ secrets.CHANNEL_IDS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python bot.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config user.name 'GamerPower Bot'
          git config user.email 'bot@noreply.github.com'
          git add sent_games.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update sent games list [skip ci]"
            git pull --rebase
            git push
          fi
